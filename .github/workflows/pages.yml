name: Deploy GitBook documentation

on:
  push:
    branches: ["main"]
    paths:
      - "doc/**"
      - "bench/**"
      - "report/**"
      - "site/**"
      - "README.md"
      - "QUICK_START.md"
      - "API_REFERENCE.md"
      - "BENCHMARK_REPORT.md"
      - "CHANGELOG_0.1.5.md"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js 10 (GitBook 3 compatibility)
        uses: actions/setup-node@v4
        with:
          node-version: "10.24.1"

      - name: Cache GitBook plugins
        uses: actions/cache@v4
        with:
          path: |
            ~/.gitbook
            site/node_modules
          key: gitbook-${{ runner.os }}-${{ hashFiles('site/book.json') }}

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Install GitBook CLI
        run: npm install -g gitbook-cli@2.3.2

      - name: Sync and build documentation
        working-directory: site
        run: |
          python3 scripts/sync_docs.py
          gitbook install
          gitbook build . _book

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/_book

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
